<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FitEarn" />
  <link id="appleIcon" rel="apple-touch-icon" href="" />
  <title>FitEarn Workout Tracker</title>
  <script>
    (function generateCashDumbbellIcon() {
      const canvas = document.createElement("canvas");
      canvas.width = 180;
      canvas.height = 180;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#1c1c1e";
      ctx.fillRect(0, 0, 180, 180);

      ctx.fillStyle = "#248a3d";
      ctx.beginPath();
      ctx.roundRect(14, 74, 10, 32, 4);
      ctx.roundRect(156, 74, 10, 32, 4);
      ctx.fill();

      ctx.fillStyle = "#30d158";
      ctx.beginPath();
      ctx.roundRect(28, 62, 18, 56, 6);
      ctx.roundRect(134, 62, 18, 56, 6);
      ctx.fillRect(46, 83, 88, 14);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(90, 90, 26, 0, Math.PI * 2);
      ctx.fillStyle = "#121214";
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = "#30d158";
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.font = "900 32px -apple-system, BlinkMacSystemFont, Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("$", 90, 92);

      document.getElementById("appleIcon").href = canvas.toDataURL("image/png");
    })();
  </script>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1c1c1e;
      --input-bg: #2c2c2e;
      --text-main: #f5f5f7;
      --text-muted: #98989d;
      --accent: #30d158;
      --border: #38383a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 16px 60px;
      max-width: 500px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      padding-top: 10px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .wallet-card {
      background: linear-gradient(145deg, #1f2922, #1c1c1e);
      border: 1px solid #2c4433;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .wallet-label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .wallet-amount {
      font-size: 44px;
      font-weight: 800;
      color: var(--accent);
      display: inline-block;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.2s ease;
    }

    .wallet-amount.pulse {
      transform: scale(1.15);
      color: #63e682;
    }

    .today-earned {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .card-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--input-bg);
      padding: 14px 16px;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
                  background-color 0.25s ease,
                  border-color 0.25s ease,
                  box-shadow 0.25s ease;
    }

    .task-item:active {
      transform: scale(0.97);
    }

    .task-item.completed {
      background-color: rgba(48, 209, 88, 0.16);
      border-color: rgba(48, 209, 88, 0.5);
      box-shadow: 0 4px 14px rgba(48, 209, 88, 0.15);
    }

    .task-item.pop {
      animation: taskPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes taskPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: var(--accent);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    input[type="checkbox"]:checked {
      transform: scale(1.12);
    }

    .task-name {
      font-size: 16px;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .task-item.completed .task-name {
      color: #ffffff;
    }

    .task-reward {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      transition: transform 0.2s ease;
    }

    .task-item.completed .task-reward {
      transform: scale(1.08);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .summary-row span:last-child {
      font-weight: 700;
    }

    .time-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
      text-align: center;
    }

    .time-pill {
      background-color: var(--input-bg);
      padding: 10px 6px;
      border-radius: 10px;
    }

    .time-val {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }

    .time-unit {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .history-list {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      padding: 10px 12px;
      background-color: var(--input-bg);
      border-radius: 10px;
    }

    .history-empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      padding: 12px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>FitEarn Tracker</h1>
  </header>

  <div class="wallet-card">
    <div class="wallet-label">Available Wallet Balance</div>
    <div class="wallet-amount" id="walletDisplay">$0</div>
    <div class="today-earned" id="todayDisplay">Earned today: $0 / $20</div>
  </div>

  <div class="card">
    <div class="card-title">
      <span>Daily Workout</span>
      <span style="font-size: 12px; color: var(--text-muted);" id="dateDisplay"></span>
    </div>
    <div class="task-list">
      <label class="task-item" id="row-pushups">
        <div class="task-left">
          <input type="checkbox" id="chk-pushups" onchange="toggleTask('pushups')" />
          <span class="task-name">25 Pushups</span>
        </div>
        <span class="task-reward">+$5</span>
      </label>

      <label class="task-item" id="row-situps">
        <div class="task-left">
          <input type="checkbox" id="chk-situps" onchange="toggleTask('situps')" />
          <span class="task-name">25 Situps</span>
        </div>
        <span class="task-reward">+$5</span>
      </label>

      <label class="task-item" id="row-crunches">
        <div class="task-left">
          <input type="checkbox" id="chk-crunches" onchange="toggleTask('crunches')" />
          <span class="task-name">25 Crunches</span>
        </div>
        <span class="task-reward">+$5</span>
      </label>

      <label class="task-item" id="row-steps">
        <div class="task-left">
          <input type="checkbox" id="chk-steps" onchange="toggleTask('steps')" />
          <span class="task-name">10,000 Steps</span>
        </div>
        <span class="task-reward">+$5</span>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <span>Wishlist (Up to 5 Items)</span>
    </div>
    <div class="summary-row">
      <span style="color: var(--text-muted);">Wishlist Grand Total:</span>
      <span id="grandTotalDisplay">$0.00</span>
    </div>
    <div class="summary-row">
      <span style="color: var(--text-muted);">Remaining Needed:</span>
      <span id="remainingDisplay">$0.00</span>
    </div>
    <div class="time-grid">
      <div class="time-pill">
        <div class="time-val" id="daysNeeded">0</div>
        <div class="time-unit">Days</div>
      </div>
      <div class="time-pill">
        <div class="time-val" id="weeksNeeded">0</div>
        <div class="time-unit">Weeks</div>
      </div>
      <div class="time-pill">
        <div class="time-val" id="monthsNeeded">0</div>
        <div class="time-unit">Months</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <span>Workout History</span>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <script>
    const DAILY_MAX = 20;
    const TASK_VALUE = 5;

    function getTodayString() {
      const now = new Date();
      return now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0");
    }

    let state = {
      wallet: 0,
      lastActiveDate: getTodayString(),
      tasks: {
        pushups: false,
        situps: false,
        crunches: false,
        steps: false
      },
      wishlist: [
        { name: "", price: "" },
        { name: "", price: "" },
        { name: "", price: "" },
