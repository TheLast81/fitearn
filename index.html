<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FitEarn" />
  <link id="appleIcon" rel="apple-touch-icon" href="" />
  <title>FitEarn Workout Tracker</title>
  <style>
    :root { --bg: #121214; --card: #1c1c1e; --inp: #2c2c2e; --txt: #f5f5f7; --mut: #98989d; --acc: #30d158; --brd: #38383a; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--txt); padding: 20px 16px 60px; max-width: 500px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 20px; padding-top: 10px; }
    h1 { font-size: 24px; font-weight: 700; }
    .wallet-card { background: linear-gradient(145deg, #1f2922, #1c1c1e); border: 1px solid #2c4433; border-radius: 18px; padding: 20px; text-align: center; margin-bottom: 20px; }
    .wallet-label { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--mut); margin-bottom: 6px; }
    .wallet-amount { font-size: 44px; font-weight: 800; color: var(--acc); display: inline-block; transition: transform 0.2s ease; }
    .wallet-amount.pulse { transform: scale(1.15); }
    .today-earned { font-size: 13px; color: var(--mut); margin-top: 6px; }
    .card { background: var(--card); border-radius: 16px; padding: 18px; margin-bottom: 20px; border: 1px solid var(--brd); }
    .card-title { font-size: 17px; font-weight: 600; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .task-list { display: flex; flex-direction: column; gap: 12px; }
    .task-item { display: flex; align-items: center; justify-content: space-between; background: var(--inp); padding: 14px 16px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s ease; }
    .task-item.completed { background: rgba(48, 209, 88, 0.16); border-color: rgba(48, 209, 88, 0.5); }
    .task-left { display: flex; align-items: center; gap: 12px; }
    input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--acc); }
    .task-reward { font-size: 15px; font-weight: 700; color: var(--acc); }
    .row-slot { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    input[type="text"] { flex: 2; background: var(--inp); border: 1px solid var(--brd); color: var(--txt); padding: 10px 12px; border-radius: 10px; font-size: 14px; min-width: 0; }
    input[type="number"] { flex: 1; background: var(--inp); border: 1px solid var(--brd); color: var(--txt); padding: 10px; border-radius: 10px; font-size: 14px; min-width: 70px; }
    .info-btn { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--mut); background: transparent; color: var(--txt); font-size: 13px; font-weight: 700; opacity: 0.5; flex-shrink: 0; }
    .buy-btn { background: var(--acc); color: #000; border: none; border-radius: 8px; padding: 8px 10px; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .buy-btn:disabled { background: var(--inp); color: var(--mut); opacity: 0.4; }
    .summary-box { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--brd); }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; text-align: center; }
    .time-pill { background: var(--inp); padding: 10px 6px; border-radius: 10px; }
    .time-val { font-size: 18px; font-weight: 700; color: var(--acc); }
    .time-unit { font-size: 11px; color: var(--mut); text-transform: uppercase; margin-top: 2px; }
    .history-list { max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .history-item { display: flex; justify-content: space-between; font-size: 14px; padding: 10px 12px; background: var(--inp); border-radius: 10px; }
    #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #2c2c2e; color: #fff; border: 1px solid var(--acc); padding: 14px 20px; border-radius: 14px; font-size: 14px; text-align: center; z-index: 1000; opacity: 0; transition: all 0.25s ease; width: 90%; max-width: 360px; pointer-events: none; }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>
  <header><h1>FitEarn Tracker</h1></header>
  <div class="wallet-card">
    <div class="wallet-label">Available Wallet Balance</div>
    <div class="wallet-amount" id="walletDisplay">$0</div>
    <div class="today-earned" id="todayDisplay">Earned today: $0 / $20</div>
  </div>
  <div class="card">
    <div class="card-title"><span>Daily Workout</span><span style="font-size:12px;color:var(--mut);" id="dateDisplay"></span></div>
    <div class="task-list" id="taskList"></div>
  </div>
  <div class="card">
    <div class="card-title"><span>Wishlist (Up to 5 Items)</span></div>
    <div id="wishlistContainer"></div>
    <div class="summary-box">
      <div class="summary-row"><span style="color:var(--mut);">Wishlist Grand Total:</span><strong id="grandTotalDisplay">$0.00</strong></div>
      <div class="summary-row"><span style="color:var(--mut);">Remaining Needed:</span><strong id="remainingDisplay">$0.00</strong></div>
      <div class="time-grid">
        <div class="time-pill"><div class="time-val" id="daysNeeded">0</div><div class="time-unit">Days</div></div>
        <div class="time-pill"><div class="time-val" id="weeksNeeded">0</div><div class="time-unit">Weeks</div></div>
        <div class="time-pill"><div class="time-val" id="monthsNeeded">0</div><div class="time-unit">Months</div></div>
      </div>
    </div>
    <div class="summary-box">
      <div id="notesContainer"></div>
      <div class="summary-row" style="margin-top:10px;"><span style="color:var(--mut);">Notes Total:</span><strong style="color:var(--acc);" id="notesTotalDisplay">0</strong></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title"><span>Workout History</span></div>
    <div class="history-list" id="historyList"></div>
  </div>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
